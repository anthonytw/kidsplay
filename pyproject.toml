[project]
name = "kidsplay-workspace"
version = "0.1.0"
description = "KidsPlay — media management and playback for kids' devices"
requires-python = ">=3.12"
license = {text = "AGPL-3.0-or-later"}
authors = [
    {name = "Anthony Wertz", email = "awertz@pm.me"},
]

# Workspace root has no direct dependencies.
# Each package declares its own.
dependencies = []

[tool.uv.workspace]
members = [
    "packages/kidsplay-models",
    "packages/kidsplay-server",
    "packages/kidsplay-cli",
    "packages/kidsplay-device",
    "packages/kidsplay-importer-ytdlp",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    # Message extraction and .po -> .mo compilation (scripts/i18n.py). Only the
    # tooling needs it: the packages read compiled catalogs with stdlib gettext.
    "babel>=2.16",
    # ty is pre-1.0 and its checks change between releases: pin exactly and
    # upgrade deliberately.
    "ty==0.0.84",
    # Headless Chromium for the web UI screenshots (demo/screenshots.py). Pinned
    # so reruns render identically; the browser itself comes from
    # `uv run playwright install chromium` and is not needed by the tests.
    "playwright==1.56.0",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = [
    "packages/kidsplay-models/tests",
    "packages/kidsplay-server/tests",
    "packages/kidsplay-cli/tests",
    "packages/kidsplay-device/tests",
    "packages/kidsplay-importer-ytdlp/tests",
    "demo/tests",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "TCH",  # type checking imports
    "ANN",  # type annotations on every function
]

[tool.ruff.lint.isort]
# Workspace packages live in separate src/ dirs, so ruff can't infer them.
known-first-party = [
    "demo",
    "kidsplay_cli",
    "kidsplay_device",
    "kidsplay_importer_ytdlp",
    "kidsplay_models",
    "kidsplay_server",
]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = [
    "packages/kidsplay-models/src",
    "packages/kidsplay-models/tests",
    "packages/kidsplay-server/src",
    "packages/kidsplay-server/tests",
    "packages/kidsplay-cli/src",
    "packages/kidsplay-cli/tests",
    "packages/kidsplay-device/src",
    "packages/kidsplay-device/tests",
    "packages/kidsplay-importer-ytdlp/src",
    "packages/kidsplay-importer-ytdlp/tests",
    "demo",
    "scripts",
]

[tool.ty.analysis]
# Only honour explicit `# ty: ignore[rule]` suppressions, never a blanket
# `# type: ignore`, so every suppression names the rule it silences.
respect-type-ignore-comments = false

[tool.ty.rules]
# Fail on stale `# ty: ignore[...]` comments so suppressions don't outlive the
# problem they were added for.
unused-ignore-comment = "error"

[tool.ty.terminal]
error-on-warning = true
