[project]
name = "kidsplay-cli"
version = "0.1.0"
description = "CLI client for KidsPlay media management"
requires-python = ">=3.12"
license = {text = "AGPL-3.0-or-later"}
dependencies = [
    "kidsplay-models",
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.0",
]

[tool.uv.sources]
kidsplay-models = { workspace = true }

[project.scripts]
kidsplay = "kidsplay_cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kidsplay_cli"]
