[project]
name = "kidsplay-device"
version = "0.1.0"
description = "pygame-ce based media player for RPi CM4 handheld devices"
requires-python = ">=3.12"
license = {text = "AGPL-3.0-or-later"}
dependencies = [
    "kidsplay-models",
    "pygame-ce>=2.5",
    "httpx>=0.27",
    # Pairing screen: QR code (pure Python, no Pillow) and mDNS discovery of
    # the server.
    "segno>=1.6",
    "zeroconf>=0.132",
]

[tool.uv.sources]
kidsplay-models = { workspace = true }

[project.scripts]
kidsplay-player = "kidsplay_device.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kidsplay_device"]

[tool.hatch.build]
# Include non-Python assets (fonts, etc.) from the package directory.
include = ["src/kidsplay_device/**"]
