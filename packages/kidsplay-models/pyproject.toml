[project]
name = "kidsplay-models"
version = "0.1.0"
description = "Shared Pydantic data models for the KidsPlay system"
requires-python = ">=3.12"
license = {text = "AGPL-3.0-or-later"}
dependencies = [
    "pydantic>=2.12,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kidsplay_models"]
